name: Apply v0.4 Focus Guard hardening

on:
  push:
    branches: [feature/adaptive-coach-v0.4.0-review]
    paths:
      - '.github/workflows/v04-focus-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-coach-v0.4.0-review
      - name: Patch Focus Guard
        shell: python
        run: |
          from pathlib import Path
          import re

          adaptive = Path('src/adaptive.js')
          text = adaptive.read_text()
          old = """export function fatigueScore(attempts = []) {
            const recent = attempts.slice(-12);"""
          new = """export function fatigueScore(attempts = [], now = Date.now()) {
            const recent = (attempts || []).filter(a => {
              const at = new Date(a.at || 0).getTime();
              const age = now - at;
              return Number.isFinite(at) && age >= 0 && age <= 120 * 60000;
            }).slice(-12);"""
          if old not in text:
              raise SystemExit('fatigueScore target not found')
          adaptive.write_text(text.replace(old, new))

          coach = Path('src/coach.js')
          text = coach.read_text()
          marker = "let fatigueNoticeAt = coach.attempts.length;"
          replacement = """let fatigueNoticeAt = coach.attempts.length;
          let lastActivityAt = Date.now();
          const IDLE_MS = 90 * 1000;

          function markActivity() { lastActivityAt = Date.now(); }
          function isEngaged(now = Date.now()) { return !document.hidden && now - lastActivityAt <= IDLE_MS; }"""
          if marker not in text:
              raise SystemExit('activity marker not found')
          text = text.replace(marker, replacement)

          old_loops = """  document.addEventListener('visibilitychange', () => { if (!document.hidden && coach.activeSession && !coach.activeSession.paused) coach.activeSession.lastTickAt = Date.now(); });
            document.addEventListener('click', event => {"""
          new_loops = """  ['pointerdown','keydown','wheel','touchstart'].forEach(type => document.addEventListener(type, markActivity, { passive:true }));
            document.addEventListener('visibilitychange', () => {
              if (!document.hidden) markActivity();
              if (!document.hidden && coach.activeSession && !coach.activeSession.paused) coach.activeSession.lastTickAt = Date.now();
            });
            document.addEventListener('click', event => {"""
          if old_loops not in text:
              raise SystemExit('startLoops target not found')
          text = text.replace(old_loops, new_loops)

          text = text.replace("function trackContext() {\n  if (document.hidden) return;", "function trackContext() {\n  if (!isEngaged()) return;")
          text = text.replace("if (s && !s.paused && !document.hidden) {", "if (s && !s.paused && isEngaged(now)) {")
          text = text.replace("Timer counts active foreground learning time. It will not cut off a question.", "Timer counts engaged foreground learning time and pauses after 90 seconds idle. It will not cut off a question.")
          coach.write_text(text)

          tests = Path('tests/adaptive-policy.test.js')
          text = tests.read_text()
          append = """

          test('fatigue ignores stale mistakes from an older study session', async () => {
            const { fatigueScore } = await import('../src/adaptive.js');
            const old = Date.now() - 6 * 60 * 60000;
            const attempts = Array.from({length:8}, (_,i) => ({
              skill:'regime', correct:false, responseMs:9000,
              at:new Date(old - i * 60000).toISOString()
            }));
            const fatigue = fatigueScore(attempts);
            assert.equal(fatigue.label, 'Fresh');
            assert.equal(fatigue.score, 15);
          });
          """
          if 'fatigue ignores stale mistakes' not in text:
              tests.write_text(text + append)
      - name: Verify release gate
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adaptive.js src/coach.js tests/adaptive-policy.test.js
          git commit -m "Harden Focus Guard recency and idle tracking"
          git push origin HEAD:feature/adaptive-coach-v0.4.0-review
