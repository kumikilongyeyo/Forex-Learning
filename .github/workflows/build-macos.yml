name: Build macOS desktop app

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-macos.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Build universal macOS installer
        run: npm run desktop:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Forex-Lab-PH-macOS
          path: |
            dist/*.pkg
            dist/*.zip
      - name: Publish macOS files to versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Forex Lab PH ${TAG}" --notes "Desktop release for macOS and Windows. Newer installers replace obsolete program files while preserving learning progress and downloaded market data." || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" dist/*.pkg dist/*.zip --clobber
