name: Build Windows desktop app

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-windows.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Build Windows installer
        run: npm run desktop:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Forex-Lab-PH-Windows
          path: |
            dist/*.exe
            dist/*Windows*.zip
      - name: Publish Windows files to versioned GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $VERSION = node -p "require('./package.json').version"
          $TAG = "v$VERSION"
          gh release view $TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $TAG --target $env:GITHUB_SHA --title "Forex Lab PH $TAG" --notes "Desktop release for macOS and Windows. Newer installers replace obsolete program files while preserving learning progress and downloaded market data."
            if ($LASTEXITCODE -ne 0) {
              gh release view $TAG | Out-Null
            }
          }
          Get-ChildItem dist -File | Where-Object { $_.Name -like '*Windows*' -and ($_.Extension -eq '.exe' -or $_.Extension -eq '.zip') } | ForEach-Object {
            gh release upload $TAG $_.FullName --clobber
          }
